repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: \.ipynb$
      - id: ruff-format
        exclude: \.ipynb$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-q", "-r", "packages", "-x", "packages/meta", "-s", "B101,B608"]
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        stages: [manual]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["-L", "dataframe,nd", "-S", "*.lock,*.csv,*.txt,*.json,*.md,*.png,*.jpg,*.gif,*.zip,*.html"]
        exclude: "(^build/|^dist/|^packages/.*/tests/fixtures/|^packages/.*/examples/.*\\.ipynb$)"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1500"]
        exclude: "(^packages/.*/examples/.*\\.ipynb$|\\.ipynb$)"

ci:
  autofix_prs: true
  autofix_commit_msg: "chore(pre-commit): auto-fix"
  skip: [pip-audit]

name: Package Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  package-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.21"

      - name: Install test tooling
        run: uv pip install --system build

      - name: Determine diff base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "base=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify origin/master >/dev/null 2>&1; then
            echo "base=$(git rev-parse origin/master)" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed packages
        id: changed
        run: echo "packages=$(python scripts/list_changed_packages.py --base '${{ steps.base.outputs.base }}')" >> "$GITHUB_OUTPUT"

      - name: Enforce version bumps for changed packages
        if: steps.changed.outputs.packages != '[]'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          packages = json.loads(r'''${{ steps.changed.outputs.packages }}''')
          subprocess.check_call(
              ["python", "scripts/check_version_bumps.py", "--base", r"${{ steps.base.outputs.base }}", *packages]
          )
          PY

      - name: Validate changed plugin packages from built wheels
        if: steps.changed.outputs.packages != '[]'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          packages = json.loads(r'''${{ steps.changed.outputs.packages }}''')
          for package in packages:
              if package.startswith("packages/meta/"):
                  continue
              if package == "packages/calibration/calibrated-explanations-calibration-idr":
                  # This package requires Python >=3.13 and a real upstream isodistrreg build.
                  # It is validated by the dedicated mandatory idr-isodistrreg-runtime job below.
                  continue
              subprocess.check_call(
                  [
                      "python",
                      "scripts/runtime_check_package.py",
                      "--package-path",
                      package,
                  ]
              )
          PY

  all-plugin-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.21"

      - name: Install runtime tooling
        run: uv pip install --system build

      - name: Validate every official plugin from built wheels
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess

          packages = json.loads(
              subprocess.check_output(["python", "scripts/list_official_plugin_packages.py"], text=True)
          )
          for package in packages:
              subprocess.check_call(
                  [
                      "python",
                      "scripts/runtime_check_package.py",
                      "--package-path",
                      package,
                      "--skip-pytest",
                  ]
              )
          PY

  idr-isodistrreg-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust toolchain for isodistrreg
        uses: dtolnay/rust-toolchain@stable

      - name: Install IDR plugin with real upstream isodistrreg
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "isodistrreg @ git+https://github.com/AlexanderHenzi/isodistrreg.git@324d85a6e83c4c44c9fde1c29d0a2b743776096e#subdirectory=bindings/python"
          python -m pip install -e packages/calibration/calibrated-explanations-calibration-idr
          python -m pip install "calibrated-explanations>=0.11" scikit-learn pytest

      - name: Run mandatory real isodistrreg and CE checks
        env:
          CE_IDR_REQUIRE_REAL_BACKEND: "1"
        run: |
          pytest -q \
            packages/calibration/calibrated-explanations-calibration-idr/tests/test_idr_adapter.py::test_should_use_real_isodistrreg_when_installed \
            packages/calibration/calibrated-explanations-calibration-idr/tests/test_ce_integration.py \
            packages/calibration/calibrated-explanations-calibration-idr/tests/test_plugin_meta.py::test_plugin_meta_validates_against_ce_contract \
            packages/calibration/calibrated-explanations-calibration-idr/tests/test_notebook_contract.py

name: Repo Policy

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  repo-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository structure
        run: python scripts/validate_repo_structure.py

      - name: Validate package references in docs
        run: python scripts/check_docs_install_commands.py

name: Repo Policy

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  repo-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install policy tooling
        run: python -m pip install packaging pytest

      - name: Validate repository structure and lifecycle metadata
        run: python scripts/validate_repo_structure.py

      - name: Validate metapackage curation invariants
        run: python scripts/check_meta_package_sync.py

      - name: Validate generated package index
        run: python scripts/generate_package_index.py --check

      - name: Validate package references in docs
        run: python scripts/check_docs_install_commands.py

      - name: Run lifecycle and governance test suite
        run: python -m pytest tests -q

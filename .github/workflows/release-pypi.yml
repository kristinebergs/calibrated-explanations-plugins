name: Release PyPI Packages

# A tag alone never publishes anything. `scripts/lifecycle.py release` gates
# every release: mature plugins only, valid non-empty metapackage curation,
# tag/version match, and default-branch reachability. Deprecated packages have
# no release path here; an exceptional deprecated release would be a reviewed
# one-off workflow change (see docs/plugin-lifecycle.md).

on:
  push:
    tags:
      - "pkg/**"

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    outputs:
      package_path: ${{ steps.release.outputs.package_path }}
      package_type: ${{ steps.release.outputs.package_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: python -m pip install build packaging

      - name: Validate repository structure and lifecycle policy
        run: |
          python scripts/validate_repo_structure.py
          python scripts/lifecycle.py check

      - name: Resolve and gate the release tag
        id: release
        shell: bash
        run: |
          python scripts/lifecycle.py release \
            --tag "${GITHUB_REF_NAME}" \
            --default-branch origin/main >> "$GITHUB_OUTPUT"

      - name: Build the tagged package and its curated closure
        shell: bash
        run: |
          mkdir -p dist .wheelhouse
          python - <<'PY'
          import json
          import subprocess
          tagged = r'''${{ steps.release.outputs.package_path }}'''
          # For a metapackage tag this is the metapackage plus only the mature
          # curated plugins it references (and, for the umbrella, the family
          # metapackages); experimental packages are never built here.
          for path in json.loads(r'''${{ steps.release.outputs.build_paths }}'''):
              outdir = "dist" if path == tagged else ".wheelhouse"
              subprocess.check_call(["python", "-m", "build", "--outdir", outdir, path])
          PY

      - name: Validate the plugin artifact
        if: steps.release.outputs.package_type == 'plugin'
        run: |
          python scripts/runtime_check_package.py \
            --package-path "${{ steps.release.outputs.package_path }}" \
            --artifact-dir dist

      - name: Validate the metapackage artifact
        if: steps.release.outputs.package_type == 'meta'
        run: |
          python scripts/runtime_check_metapackage.py \
            --package-path "${{ steps.release.outputs.package_path }}" \
            --artifact-dir dist \
            --wheelhouse .wheelhouse

      - name: Upload validated distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # No checkout: publish exactly the validated artifact, nothing rebuilt,
      # no repository code executed in the trusted-publishing context.
      - name: Download validated distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

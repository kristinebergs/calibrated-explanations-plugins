name: Meta Package Checks

# A metapackage dependency change triggers curation policy validation,
# building all selected artifacts, installation from a local wheelhouse, and
# runtime verification of the resulting metapackage environment.
on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/meta-package-checks.yml"
  pull_request:
    paths:
      - "packages/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/meta-package-checks.yml"

jobs:
  meta-package-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.21"

      - name: Install build tooling
        run: uv pip install --system build packaging

      - name: Validate metapackage curation invariants
        run: python scripts/check_meta_package_sync.py

      - name: Validate docs install commands
        run: python scripts/check_docs_install_commands.py

      - name: Build local wheelhouse
        shell: bash
        run: |
          mkdir -p .wheelhouse
          python - <<'PY'
          import json
          import subprocess

          packages = json.loads(
              subprocess.check_output(["python", "scripts/list_buildable_packages.py"], text=True)
          )
          for package in packages:
              subprocess.check_call(["python", "-m", "build", "--outdir", ".wheelhouse", package])
          PY

      - name: Install metapackages against local wheelhouse
        shell: bash
        run: |
          uv pip install --system calibrated-explanations[viz]
          uv pip install --system --find-links .wheelhouse calibrated-explanations-calibration
          uv pip install --system --find-links .wheelhouse calibrated-explanations-explanation
          uv pip install --system --find-links .wheelhouse calibrated-explanations-visualization
          uv pip install --system --find-links .wheelhouse calibrated-explanations-plugins

      - name: Verify metapackage runtime environments
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          metapackages = [
              "packages/meta/calibrated-explanations-calibration",
              "packages/meta/calibrated-explanations-explanation",
              "packages/meta/calibrated-explanations-visualization",
              "packages/meta/calibrated-explanations-plugins",
          ]
          for package in metapackages:
              subprocess.check_call(
                  [
                      "python",
                      "scripts/runtime_check_metapackage.py",
                      "--package-path",
                      package,
                      "--artifact-dir",
                      ".wheelhouse",
                      "--wheelhouse",
                      ".wheelhouse",
                  ]
              )
          PY

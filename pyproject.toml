[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "NPY", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["S603", "S607", "E501"]
".github/**/*.py" = ["S603", "S607"]
"conftest.py" = ["S110"]
"**/tests/**/*.py" = ["E402", "N806", "B017", "S104", "S105"]
"tests/**/*.py" = ["S603", "S607"]
"packages/**/ensured.py" = ["E501"]
"packages/**/instance_workspace.py" = ["E501"]
# Example notebooks are supplementary documentation: allow long lines, late
# imports after markdown/setup cells, and the pip-bootstrap subprocess cell.
"packages/**/examples/*.ipynb" = ["E402", "E501", "S603", "S607"]

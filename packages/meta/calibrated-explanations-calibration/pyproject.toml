[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrated-explanations-calibration"
version = "0.2.0"
description = "Curated calibration plugin metapackage for calibrated-explanations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Curation policy: only plugins with status = "mature" may be listed here.
    # No calibration plugin is currently mature, so this set is empty.
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ce_plugin_repo]
family = "meta"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrated-explanations-calibration"
version = "0.1.0"
description = "Official metapackage for calibrated-explanations plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "calibrated-explanations-calibration-example>=0.1,<1"
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ce_plugin_repo]
family = "meta"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrated-explanations-visualization"
version = "0.2.1"
description = "Curated visualization plugin metapackage for calibrated-explanations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Curation policy: only plugins with status = "mature" may be listed here.
    # calibrated-explanations-visualization-plotly is mature but not yet
    # published to PyPI (name unclaimed, trusted publisher pending), so the
    # curated set stays empty until its first release exists — a metapackage
    # dependency must be resolvable from PyPI.
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ce_plugin_repo]
family = "meta"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrated-explanations-visualization"
version = "0.3.0"
description = "Curated visualization plugin metapackage for calibrated-explanations"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
maintainers = [
    { name = "Tuwe Löfström", email = "tuwe.lofstrom@ju.se" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Curation policy: only plugins with status = "mature" may be listed here.
    # calibrated-explanations-visualization-plotly is "mature" and published
    # to PyPI (docs/plugin-lifecycle.md). The floor is 0.3.5, the first
    # published version whose pyproject.toml comment correctly records this
    # curation decision; the <0.4 ceiling pins to the reviewed 0.3.x line —
    # a future 0.4 release requires an explicit curation review before this
    # family adopts it.
    "calibrated-explanations-visualization-plotly>=0.3.5,<0.4",
]

[project.optional-dependencies]
# Delegates to the Plotly plugin's own [live] extra (its Dash dependency
# contract), so this metapackage never declares dash directly.
live = [
    "calibrated-explanations-visualization-plotly[live]>=0.3.5,<0.4",
]

[project.urls]
Repository = "https://github.com/kristinebergs/calibrated-explanations-plugins"
Issues = "https://github.com/kristinebergs/calibrated_explanations/issues"
Security = "https://github.com/kristinebergs/calibrated_explanations/security/policy"
Documentation = "https://github.com/kristinebergs/calibrated_explanations"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ce_plugin_repo]
family = "meta"

        [build-system]
        requires = ["hatchling"]
        build-backend = "hatchling.build"

        [project]
        name = "calibrated-explanations-explanation-factual-shap"
        version = "0.1.0"
        description = "Official explanation plugin for calibrated-explanations"
        readme = "README.md"
        requires-python = ">=3.10"
        dependencies = [
            "calibrated-explanations>=0.11",
            "shap>=0.44",
        ]

        [project.entry-points."calibrated_explanations.plugins"]
factual_shap = "ce_explanation_factual_shap.plugin:FactualShapExplanationPlugin"

        [tool.hatch.build.targets.wheel]
        packages = ["src/ce_explanation_factual_shap"]

        [tool.ce_plugin_repo]
        family = "explanation"
        import_name = "ce_explanation_factual_shap"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrated-explanations-explanation-factual-example"
version = "0.1.0"
description = "Official explanation plugin for calibrated-explanations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "calibrated-explanations>=0.11",
]

[project.entry-points."calibrated_explanations.plugins"]
factual_example = "ce_explanation_factual_example.plugin:FactualExampleExplanationPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_explanation_factual_example"]

[tool.calibrated_explanations.plugins]
trusted = ["official.explanation.factual.example"]

[tool.ce_plugin_repo]
family = "explanation"
import_name = "ce_explanation_factual_example"

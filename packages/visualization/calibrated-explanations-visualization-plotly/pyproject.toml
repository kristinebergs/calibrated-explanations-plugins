[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrated-explanations-visualization-plotly"
version = "0.3.2"
description = "Plotly visualization plugin layouts for calibrated-explanations"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
maintainers = [
    { name = "Tuwe Löfström", email = "tuwe.lofstrom@ju.se" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Lower bounds: CE >=1.0.0rc2 is required for native third-party plot-plugin
# dispatch (full option/runtime fidelity through the public factual,
# alternative, and global/dashboard plotting APIs without a compatibility
# bridge); <2 keeps the ceiling at the 1.x dispatch contract; plotly >=5.18
# is the oldest line exercised by the floor-boundary environment; numpy
# >=1.24 matches CE's own floor and is a direct runtime import (array
# coercion in builders). Matplotlib is NOT a runtime dependency — CE's [viz]
# extra is needed only by the parity test suite (see
# [project.optional-dependencies].test).
dependencies = [
    "calibrated-explanations>=1.0.0rc2,<2",
    "numpy>=1.24",
    "plotly>=5.18",
]

[project.urls]
Repository = "https://github.com/kristinebergs/calibrated-explanations-plugins"
# Public intake for the CE plugin ecosystem lives in the public core repository
# (this plugin monorepo is private); the same applies to security reports.
Issues = "https://github.com/kristinebergs/calibrated_explanations/issues"
Security = "https://github.com/kristinebergs/calibrated_explanations/security/policy"
Documentation = "https://github.com/kristinebergs/calibrated_explanations"

[project.optional-dependencies]
live = [
    # dash <3.1 pins Flask/Werkzeug lines carrying known vulnerabilities
    # (PYSEC-2024-35 exposure documented in MATURITY.md); >=3.1 is the oldest
    # line scanned clean and exercised by the floor-boundary environment.
    "dash>=3.1",
]
test = [
    # Parity suite renders CE's matplotlib adapter as the oracle.
    "calibrated-explanations[viz]>=1.0.0rc2,<2",
    "pytest",
    "pytest-cov",
    "scikit-learn",
]

[project.entry-points."calibrated_explanations.plugins"]
plotly_visualization = "ce_visualization_plotly.plugin:PlotlyVisualizationBootstrap"

[project.entry-points."calibrated_explanations.plugins.plot_builders"]
uncertainty_quadrant = "ce_visualization_plotly.quadrant:UncertaintyQuadrantPlotBuilder"
ensured = "ce_visualization_plotly.ensured:LocalEnsuredPlotBuilder"
factual_bars = "ce_visualization_plotly.factual_bars:LocalFactualBarsPlotBuilder"
factual_simple = "ce_visualization_plotly.factual_simple:LocalFactualSimplePlotBuilder"
alternative_bars = "ce_visualization_plotly.alternative_bars:LocalAlternativeBarsPlotBuilder"
alternative_feature_summary = "ce_visualization_plotly.alternative_feature_summary:AlternativeFeatureSummaryPlotBuilder"
instance_explorer = "ce_visualization_plotly.instance_explorer:GlobalInstanceExplorerPlotBuilder"
instance_workspace = "ce_visualization_plotly.instance_workspace:InstanceWorkspaceDashboardBuilder"

[project.entry-points."calibrated_explanations.plugins.plot_renderers"]
uncertainty_quadrant = "ce_visualization_plotly.quadrant:UncertaintyQuadrantPlotRenderer"
ensured = "ce_visualization_plotly.ensured:LocalEnsuredPlotRenderer"
factual_bars = "ce_visualization_plotly.factual_bars:LocalFactualBarsPlotRenderer"
factual_simple = "ce_visualization_plotly.factual_simple:LocalFactualSimplePlotRenderer"
alternative_bars = "ce_visualization_plotly.alternative_bars:LocalAlternativeBarsPlotRenderer"
alternative_feature_summary = "ce_visualization_plotly.alternative_feature_summary:AlternativeFeatureSummaryPlotRenderer"
instance_explorer = "ce_visualization_plotly.instance_explorer:GlobalInstanceExplorerPlotRenderer"
instance_workspace = "ce_visualization_plotly.instance_workspace:InstanceWorkspaceDashboardRenderer"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_visualization_plotly"]

[tool.pytest.ini_options]
markers = [
    "viz: semantic parity tests against CE PlotSpec/matplotlib rendering",
]

[tool.ce_plugin_repo]
family = "visualization"
# Held at "experimental" until the publication criteria are met: the PyPI
# name is unclaimed (verified 404 on 2026-07-19), no release exists to verify
# the documented install command against, and the trusted publisher is not
# yet configured. See MATURITY.md for the full re-audit evidence.
status = "experimental"
import_name = "ce_visualization_plotly"

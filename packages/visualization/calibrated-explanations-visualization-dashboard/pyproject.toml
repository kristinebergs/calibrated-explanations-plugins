[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrated-explanations-visualization-dashboard"
version = "0.1.1"
description = "Dashboard visualization plugin for calibrated-explanations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "calibrated-explanations[viz]>=0.11",
    "plotly>=5.18",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
png = ["kaleido>=0.2"]

[project.entry-points."calibrated_explanations.plugins"]
dashboard_visualization = "ce_visualization_dashboard.plugin:DashboardVisualizationBootstrap"

[project.entry-points."calibrated_explanations.plugins.plot_builders"]
dashboard_visualization = "ce_visualization_dashboard.plugin:DashboardPlotBuilder"

[project.entry-points."calibrated_explanations.plugins.plot_renderers"]
dashboard_visualization = "ce_visualization_dashboard.plugin:DashboardPlotRenderer"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_visualization_dashboard"]

[tool.ce_plugin_repo]
family = "visualization"
status = "experimental"
import_name = "ce_visualization_dashboard"

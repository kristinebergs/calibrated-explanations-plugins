name: Plugin publication and maturity request
description: >-
  Ask the calibrated-explanations maintainers to review a plugin for adoption
  into the official plugin repository, or to promote an existing experimental
  repository plugin to mature (PyPI-publishable) status.
title: "[plugin request]: "
labels: ["plugin-request", "maturity-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to the calibrated-explanations plugin ecosystem!

        This form is the public entry point for plugin publication and maturity
        requests. The official plugin monorepo is private; accepted work is
        transferred there after maintainer triage. Submitting this form does
        **not** authorise publication — final maturity and publication decisions
        rest with the designated CE plugin maintainers.

        You can also keep your plugin independently published as a *community
        plugin* without official adoption; say so below if you only want a
        discoverability listing.
  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      options:
        - Review an externally hosted plugin for possible adoption into the official plugin repository
        - Promote an existing experimental plugin in the plugin repository to mature
        - List an externally maintained community plugin for discoverability only
    validations:
      required: true
  - type: input
    id: distribution-name
    attributes:
      label: Distribution name
      description: The (proposed) PyPI distribution name.
      placeholder: calibrated-explanations-<family>-<slug>
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: Plugin family
      options:
        - calibration
        - explanation
        - visualization
    validations:
      required: true
  - type: input
    id: plugin-identifier
    attributes:
      label: Plugin identifier
      description: The identifier declared in plugin_meta["name"].
    validations:
      required: true
  - type: input
    id: source-location
    attributes:
      label: Source location
      description: >-
        Repository URL for external plugins, or the packages/<family>/<name>
        path for plugins already in the plugin monorepo.
    validations:
      required: true
  - type: input
    id: maintainer
    attributes:
      label: Maintainer
      description: >-
        Who will maintain the plugin after adoption (name and GitHub handle)?
        Official adoption requires a named maintainer.
    validations:
      required: true
  - type: input
    id: compatibility
    attributes:
      label: Python and calibrated-explanations compatibility
      placeholder: 'Python >=3.11; calibrated-explanations >=0.11'
    validations:
      required: true
  - type: textarea
    id: test-evidence
    attributes:
      label: Test evidence
      description: >-
        What is tested and how (unit tests, wheel-runtime tests, CI links)?
        For maturity promotion, tests must pass when run from a built wheel.
    validations:
      required: true
  - type: textarea
    id: scientific-evidence
    attributes:
      label: Scientific or semantic evidence
      description: >-
        Family-specific evidence. Calibration: the claimed calibration/interval
        property, its assumptions, and at least one independently checkable
        expected result. Explanation: exact output semantics and a checkable
        semantic example. Visualization: meaning of visual encodings and
        correspondence to the underlying explanation payload. Research-derived
        plugins: cite the method and separate the original method's properties
        from those of the CE integration.
    validations:
      required: true
  - type: textarea
    id: dependencies-licence
    attributes:
      label: Dependencies and licence
      description: >-
        Direct runtime dependencies, licence of the plugin, and any licence or
        security concerns in the dependency tree.
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Known limitations and failure modes
    validations:
      required: true
  - type: input
    id: pypi-ownership
    attributes:
      label: PyPI name and ownership status
      description: >-
        Is the distribution name available on PyPI, already owned by you, or
        already owned by the CE maintainers? Official publication requires the
        name to be available or transferable to project control.
    validations:
      required: true
  - type: dropdown
    id: metapackage-inclusion
    attributes:
      label: Metapackage inclusion requested?
      description: >-
        Inclusion in a family metapackage means "recommended default
        installation" and is a separate curation decision from maturity.
      options:
        - "No"
        - "Yes (justify below)"
    validations:
      required: true
  - type: textarea
    id: metapackage-justification
    attributes:
      label: Metapackage inclusion justification
      description: >-
        Required when requesting inclusion: address dependency weight, platform
        restrictions, Python compatibility, CE compatibility, maintenance risk,
        and general usefulness.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: >-
            I understand that maturity, publication, and metapackage curation
            decisions are made by the designated CE plugin maintainers and are
            not granted by submitting this request.
          required: true
        - label: >-
            The plugin's licence permits redistribution and publication to PyPI.
          required: true
        - label: >-
            I am not aware of unpatched critical security vulnerabilities in
            the plugin's direct dependencies.
          required: true
